name: Compilar Chronioñ Browser x86 (Portable)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-x86:
    runs-on: windows-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python 32-bit (x86)
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x86'

    - name: Instalar dependencias para x86
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 PyQtWebEngine pyinstaller

    - name: Compilar ejecutable x86 con PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --noconsole --icon="icon.ico" --name "Chronion v1.2 x86" "navegador x86.py"

    - name: Subir ejecutable como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Chronion-v1.2-Windows-x86
        path: dist/Chronion v1.2 x86.exe
