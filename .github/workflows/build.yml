name: Compilar Chronioñ Browser a EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-WebEngine pyinstaller
        
    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --noconsole --name "Chronioñ v1.2" navegador.py

    - name: Subir ejecutable como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Chronioñ-v1.2-Windows
        path: dist/ChronionBrowser/
