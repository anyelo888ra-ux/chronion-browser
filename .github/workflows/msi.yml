name: Crear Instalador MSI de Chronioñ

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
    - name: Descargar el ejecutable oficial (Chronion.v1.2.exe)
      run: |
        Invoke-WebRequest -Uri "https://github.com/anyelo888ra-ux/chronion-browser/releases/download/v1.2/Chronion.v1.2.exe" -OutFile "Chronion.v1.2.exe"

    - name: Generar código fuente del instalador (WiX)
      run: |
        $xml = @"
        <?xml version='1.0' encoding='utf-8'?>
        <Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>
          <Product Name='Chronioñ Browser' Id='*' UpgradeCode='B5A10A3E-1234-4061-A87A-D52206B1AB64' Language='1033' Version='1.2.0' Manufacturer='Anyelo' Codepage='65001'>
            <Package Id='*' InstallerVersion='200' Compressed='yes' InstallScope='perMachine' Description='Instalador de Chronion Browser v1.2' />
            <Media Id='1' Cabinet='media1.cab' EmbedCab='yes' />
            
            <Directory Id='TARGETDIR' Name='SourceDir'>
              <Directory Id='ProgramFilesFolder'>
                <Directory Id='INSTALLDIR' Name='ChronionBrowser'>
                  <Component Id='MainExecutable' Guid='B5A10A3E-5678-4061-A87A-D52206B1AB64'>
                    <File Id='ChronionEXE' Name='Chronion.v1.2.exe' Source='Chronion.v1.2.exe' KeyPath='yes' />
                  </Component>
                </Directory>
              </Directory>
              
              <!-- Carpeta del Escritorio -->
              <Directory Id='DesktopFolder' Name='Desktop'>
                <Component Id='DesktopShortcutComponent' Guid='B5A10A3E-1111-4061-A87A-D52206B1AB64'>
                  <Shortcut Id='DesktopShortcut' Name='Chronioñ Browser' Target='[INSTALLDIR]Chronion.v1.2.exe' WorkingDirectory='INSTALLDIR' />
                  <RegistryValue Root='HKCU' Key='Software\ChronionBrowser' Name='DesktopShortcutInstalled' Type='integer' Value='1' KeyPath='yes' />
                </Component>
              </Directory>

              <!-- Carpeta del Menú Inicio -->
              <Directory Id='ProgramMenuFolder' Name='Programs'>
                <Directory Id='ApplicationProgramsFolder' Name='Chronioñ Browser'>
                  <Component Id='ApplicationShortcutComponent' Guid='B5A10A3E-2222-4061-A87A-D52206B1AB64'>
                    <Shortcut Id='ProgramMenuShortcut' Name='Chronioñ Browser' Target='[INSTALLDIR]Chronion.v1.2.exe' WorkingDirectory='INSTALLDIR' />
                    <RemoveFolder Id='CleanUpShortcuts' Directory='ApplicationProgramsFolder' On='uninstall' />
                    <RegistryValue Root='HKCU' Key='Software\ChronionBrowser' Name='MenuShortcutInstalled' Type='integer' Value='1' KeyPath='yes' />
                  </Component>
                </Directory>
              </Directory>
            </Directory>
            
            <Feature Id='ProductFeature' Title='Chronion Browser' Level='1'>
              <ComponentRef Id='MainExecutable' />
              <ComponentRef Id='DesktopShortcutComponent' />
              <ComponentRef Id='ApplicationShortcutComponent' />
            </Feature>
            
          </Product>
        </Wix>
        "@
        [System.IO.File]::WriteAllText("$PWD/installer.wxs", $xml, [System.Text.Encoding]::UTF8)

    - name: Compilar el instalador a formato MSI
      run: |
        & "${env:WIX}\bin\candle.exe" installer.wxs
        & "${env:WIX}\bin\light.exe" installer.wixobj -o "Chronion-Browser-v1.2-Installer.msi" -spdb

    - name: Subir Instalador MSI como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chronion-msi-installer
        path: Chronion-Browser-v1.2-Installer.msi
